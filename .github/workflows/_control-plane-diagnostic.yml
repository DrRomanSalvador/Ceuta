name: _Control Plane Diagnostic

on:
  push:
    branches: [scientific-traceability-crossrepo]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - mission.test_control_plane
          - mission.test_event_log
          - mission.test_work_claims
          - mission.test_shared_standard
          - mission.test_control_plane_runtime
          - mission.test_constitution_adversarial
          - mission.test_lifecycle_governance
          - mission.test_invocation_runtime
          - mission.test_zero_context_replay
          - mission.test_contribution_registry
          - mission.test_repository_integrity
          - mission.test_replay
          - mission.test_control_plane_integration
          - mission.test_handoff_runtime
          - mission.test_event_backing
          - mission.test_coordination
          - mission.test_coordination_validation
          - mission.test_coordination_idempotency
          - mission.test_coordination_controls
          - mission.test_coordination_replay
          - mission.test_coordination_invocation
          - mission.test_roman_coordination_integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated module
        run: python -m unittest -v ${{ matrix.module }}
