name: Patch evidence validity serialization

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Serialize effective validity fields
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("backend/app/core/epistemology_p0/evidence/models.py")
          text = path.read_text()
          old = '''            "parent_version_id": self.parent_version_id,\n            "unavailable_fields": self.unavailable_fields,\n            "schema_version": "1.0",\n'''
          new = '''            "parent_version_id": self.parent_version_id,\n            "unavailable_fields": self.unavailable_fields,\n            "valid_from": _ser(self.valid_from),\n            "valid_to": _ser(self.valid_to),\n            "schema_version": "1.0",\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one evidence serialization block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name "CeutIA engineering bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f backend/app/core/epistemology_p0/evidence/models.py
          git rm -f .github/workflows/_patch_evidence_serialization.yml
          git commit -m "fix: serialize evidence effective validity"
          git push origin HEAD:main
