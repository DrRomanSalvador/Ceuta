name: Patch geometric weighted index zero semantics

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact geometric-zero patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("backend/app/core/metrics.py")
          text = path.read_text()
          old = '''    if np.any(x < 0) or np.any(w < 0) or np.sum(w) <= 0:\n        raise MetricInputError("Valores y pesos deben ser no negativos; pesos con suma positiva")\n    return float(np.exp(np.sum(w * np.log(np.clip(x, 1e-15, None))) / np.sum(w)))\n'''
          new = '''    if np.any(x < 0) or np.any(w < 0) or np.sum(w) <= 0:\n        raise MetricInputError("Valores y pesos deben ser no negativos; pesos con suma positiva")\n    active = w > 0.0\n    if np.any(x[active] == 0.0):\n        return 0.0\n    return float(np.exp(np.sum(w[active] * np.log(x[active])) / np.sum(w[active])))\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one geometric index block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name "CeutIA engineering bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f backend/app/core/metrics.py
          git rm -f .github/workflows/_patch_geometric_zero.yml
          git commit -m "fix: preserve zero semantics in geometric weighted index"
          git push origin HEAD:main
