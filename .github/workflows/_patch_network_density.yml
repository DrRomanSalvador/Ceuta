name: Patch network density contract

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact network density patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("backend/app/core/metrics.py")
          text = path.read_text()
          old = '''def network_density(node_count: int, edge_count: int, *, directed: bool = False) -> float:\n    if node_count < 0 or edge_count < 0:\n        raise MetricInputError("Los tamaños de red no pueden ser negativos")\n    if node_count < 2:\n        raise MetricInputError("Se requieren al menos dos nodos")\n    max_edges = node_count * (node_count - 1) if directed else node_count * (node_count - 1) / 2\n    return float(edge_count / max_edges)\n'''
          new = '''def network_density(node_count: int, edge_count: int, *, directed: bool = False) -> float:\n    if isinstance(node_count, bool) or not isinstance(node_count, int):\n        raise MetricInputError("node_count debe ser un entero")\n    if isinstance(edge_count, bool) or not isinstance(edge_count, int):\n        raise MetricInputError("edge_count debe ser un entero")\n    if node_count < 0 or edge_count < 0:\n        raise MetricInputError("Los tamaños de red no pueden ser negativos")\n    if node_count < 2:\n        raise MetricInputError("Se requieren al menos dos nodos")\n    max_edges = node_count * (node_count - 1) if directed else node_count * (node_count - 1) // 2\n    if edge_count > max_edges:\n        raise MetricInputError("edge_count no puede superar el máximo de un grafo simple")\n    return float(edge_count / max_edges)\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one network density block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name "CeutIA engineering bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f backend/app/core/metrics.py
          git rm -f .github/workflows/_patch_network_density.yml
          git commit -m "fix: enforce network density graph bounds"
          git push origin HEAD:main
