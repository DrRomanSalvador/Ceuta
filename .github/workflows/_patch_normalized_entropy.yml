name: Patch normalized entropy singleton contract

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact normalized entropy contract patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("backend/app/core/metrics.py")
          text = path.read_text()
          old = '''    h = entropy(arr / np.sum(arr), base=np.e)\n    maximum = log(arr.size)\n    return 0.0 if maximum == 0 else float(h / maximum)\n'''
          new = '''    if arr.size < 2:\n        raise MetricInputError("La entropía normalizada requiere al menos dos unidades")\n    h = entropy(arr / np.sum(arr), base=np.e)\n    maximum = log(arr.size)\n    return float(h / maximum)\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one normalized entropy block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name "CeutIA engineering bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f backend/app/core/metrics.py
          git rm -f .github/workflows/_patch_normalized_entropy.yml
          git commit -m "fix: reject undefined singleton normalized entropy"
          git push origin HEAD:main
