name: Patch pressure concentration zero-shift contract

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact pressure concentration patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("backend/app/core/metrics.py")
          text = path.read_text()
          old = '''    score = territorial_multi_pressure_score(pressures)\n\n    shifted = score - np.min(score) + 1e-12\n\n    return territorial_concentration_hhi(shifted)\n'''
          new = '''    score = territorial_multi_pressure_score(pressures)\n\n    shifted = score - np.min(score)\n    if np.allclose(shifted, 0.0):\n        return float(1.0 / shifted.size)\n\n    return territorial_concentration_hhi(shifted)\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one pressure concentration block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name "CeutIA engineering bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f backend/app/core/metrics.py
          git rm -f .github/workflows/_patch_pressure_concentration.yml
          git commit -m "fix: remove arbitrary epsilon from pressure concentration"
          git push origin HEAD:main
