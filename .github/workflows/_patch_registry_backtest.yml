name: Patch registry historical version selection

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact registry historical snapshot patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("backend/app/core/epistemology_p0/registry.py")
          text = path.read_text()
          old = '''    def get_evidences_for_backtest(self, simulation_time: datetime, variable_filter: Optional[str] = None) -> List[Evidence]:\n        all_ev = list(self.evidences.values())\n        filtered = TemporalFilter.filter_by_available_at(all_ev, simulation_time)\n        TemporalFilter.assert_no_future_leak(filtered, simulation_time)\n        if variable_filter is None:\n            return filtered\n        return [ev for ev in filtered if getattr(ev, "variable", None) == variable_filter or ev.to_dict().get("variable") == variable_filter or ev.semantic_definition == variable_filter]\n'''
          new = '''    def get_evidences_for_backtest(self, simulation_time: datetime, variable_filter: Optional[str] = None) -> List[Evidence]:\n        all_versions = [\n            evidence\n            for versions in self.evidence_versions.values()\n            for evidence in versions\n        ]\n        if not all_versions:\n            all_versions = list(self.evidences.values())\n        filtered = TemporalFilter.snapshot_by_available_at(all_versions, simulation_time)\n        TemporalFilter.assert_no_future_leak(filtered, simulation_time)\n        if variable_filter is None:\n            return filtered\n        return [ev for ev in filtered if getattr(ev, "variable", None) == variable_filter or ev.to_dict().get("variable") == variable_filter or ev.semantic_definition == variable_filter]\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one backtest registry block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name "CeutIA engineering bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f backend/app/core/epistemology_p0/registry.py
          git rm -f .github/workflows/_patch_registry_backtest.yml
          git commit -m "fix: use point-in-time evidence versions in backtests"
          git push origin HEAD:main
