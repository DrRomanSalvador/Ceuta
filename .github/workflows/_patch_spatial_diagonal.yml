name: Patch spatial matrix diagonal contract

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact spatial diagonal patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("backend/app/core/metrics.py")
          text = path.read_text()
          old = '''    w = w.copy()\n    np.fill_diagonal(w, 0.0)\n\n    row_sum = np.sum(w, axis=1)\n'''
          new = '''    diagonal = np.diag(w)\n    if np.any(diagonal != 0.0):\n        raise MetricInputError("weights debe tener diagonal cero; los autopesos no están permitidos")\n\n    row_sum = np.sum(w, axis=1)\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one spatial diagonal block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "CeutIA engineering bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/core/metrics.py .github/workflows/_patch_spatial_diagonal.yml
          git commit -m "fix: reject nonzero spatial weight diagonal"
          git push origin HEAD:main
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/_patch_spatial_diagonal.yml || true
          git config user.name "CeutIA engineering bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove temporary spatial patch workflow"
            git push origin HEAD:main
          fi
