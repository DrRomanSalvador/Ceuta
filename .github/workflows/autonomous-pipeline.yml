name: CeutIA Autonomous Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ceutia-autonomous-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Activate validated integration stage
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install '.[dev]'
      - name: Activate pipeline contract and full integration stage
        run: python -m pytest tests/test_pipeline_fase1.py tests/test_pipeline_full_chain.py -q

  state:
    name: Activate multidomain state stage
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install '.[dev]'
      - name: Activate multidomain state and interaction stage
        run: python -m pytest tests/test_pipeline_state.py tests/test_pipeline_full_chain.py -q

  runtime:
    name: Activate executable runtime stage
    needs: state
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install '.[dev]'
      - name: Activate anticipation, runtime and closed-loop tests
        run: python -m pytest tests/core/test_anticipation.py tests/core/test_runtime.py tests/test_pipeline_full_chain.py -q
      - name: Compile autonomous daemon
        run: python -m compileall -q backend/app/monitor.py backend/app/core/pipeline

  prospective:
    name: Activate prospective validation stage
    needs: runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install '.[dev]'
      - name: Activate prospective validation
        run: python -m pytest tests/core/test_anticipation.py tests/test_pipeline_full_chain.py -q
      - name: Activate next engineering stage
        run: echo "CeutIA autonomous pipeline completed successfully; the validated revision is eligible for continuous operation."
