name: CeutIA Autonomous Metrics Cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Remove duplicated metrics module block
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("backend/app/core/metrics.py")
          source = path.read_text(encoding="utf-8")
          tree = ast.parse(source)

          docstrings = [
              node for node in tree.body
              if isinstance(node, ast.Expr)
              and isinstance(node.value, ast.Constant)
              and isinstance(node.value.value, str)
          ]
          assert len(docstrings) >= 2, "Expected the duplicated second module block"
          second_doc = next(node for node in docstrings if node.lineno > 2000)

          scientific_fn = next(
              node for node in tree.body
              if isinstance(node, ast.FunctionDef)
              and node.name == "get_scientific_metric_invariants"
          )
          assert scientific_fn.lineno > second_doc.lineno

          lines = source.splitlines(keepends=True)
          start = second_doc.lineno - 1
          end = scientific_fn.lineno - 1
          rewritten = "".join(lines[:start] + lines[end:])

          # The second duplicated block also contained a second __all__ assignment.
          tree2 = ast.parse(rewritten)
          lines2 = rewritten.splitlines(keepends=True)
          intervals = []
          for node in tree2.body:
              if node.lineno <= second_doc.lineno:
                  continue
              if isinstance(node, ast.Assign):
                  if any(isinstance(t, ast.Name) and t.id == "__all__" for t in node.targets):
                      intervals.append((node.lineno - 1, node.end_lineno))
              elif isinstance(node, ast.AnnAssign):
                  if isinstance(node.target, ast.Name) and node.target.id == "__all__":
                      intervals.append((node.lineno - 1, node.end_lineno))

          for a, b in sorted(intervals, reverse=True):
              del lines2[a:b]
          path.write_text("".join(lines2), encoding="utf-8")
          PY
      - name: Verify duplicate definitions are gone
        run: |
          python - <<'PY'
          import ast
          from collections import Counter
          from pathlib import Path
          tree = ast.parse(Path("backend/app/core/metrics.py").read_text(encoding="utf-8"))
          names = [
              node.name for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef))
          ]
          duplicates = sorted(name for name, count in Counter(names).items() if count > 1)
          assert not duplicates, f"Duplicate top-level definitions remain: {duplicates}"
          print(f"Top-level definitions unique: {len(names)}")
          PY
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          PYTHONPATH=backend python -m pytest -q
      - name: Persist cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/core/metrics.py
          git commit -m "refactor: remove duplicated metrics module block"
          git push origin HEAD:main
      - name: Remove temporary workflow
        if: always()
        run: |
          git pull --ff-only origin main || true
          git rm .github/workflows/ceutia-autonomous-metrics-cleanup.yml || true
          git commit -m "chore: remove temporary metrics cleanup workflow" || true
          git push origin HEAD:main || true
