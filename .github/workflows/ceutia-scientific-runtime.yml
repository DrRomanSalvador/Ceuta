name: CeutIA Scientific Runtime Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scientific-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements*.txt
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Compile scientific runtime
        run: python -m compileall -q app/core/runtime app/core/causal app/core/forecasting app/core/decision
      - name: Run scientific runtime tests
        run: python -m pytest ../tests/test_scientific_runtime.py -q
