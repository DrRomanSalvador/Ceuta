name: CeutIA State Trajectory Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-state-trajectory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compile changed state substrate
        run: python -m compileall -q app/core/state app/core/pipeline app/core/epistemology_p0
      - name: Run state trajectory tests
        run: python -m pytest ../tests/test_state_trajectory.py -q
      - name: Run longitudinal state estimation tests
        run: python -m pytest ../tests/test_state_estimation.py -q
      - name: Run deterministic state trajectory verifier
        run: python ../scripts/verify_state_trajectory.py
      - name: Run deterministic state estimation verifier
        run: python ../scripts/verify_state_estimation.py
      - name: Emit validation checkpoint
        run: echo "CeutIA state trajectory and estimation validation checkpoint completed"
