name: CeutIA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ceutia-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Compile, test and validate Compose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Compile all Python sources
        run: python -m compileall -q backend api ceuta-final

      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install '.[dev]'

      - name: Run full test suite
        run: python -m pytest

      - name: Verify Phase 1 repository invariants
        run: python scripts/verify_phase1.py

      - name: Verify Phase 2 foundational contracts
        run: python scripts/verify_phase2.py

      - name: Verify Phase 3 Shadow Mode invariants
        run: python scripts/verify_phase3.py

      - name: Verify Phases 4-8 implementation inventory
        run: python scripts/verify_phases_4_8.py

      - name: Verify advanced causal reasoning invariants
        run: python scripts/verify_advanced_causal.py

      - name: Validate Compose configuration
        run: docker compose config -q
