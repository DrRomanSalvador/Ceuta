name: CeutIA Continuous Advance

on:
  workflow_run:
    workflows: [CeutIA CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ceutia-advance-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  integration:
    name: Activate integration stage
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install '.[dev]'

      - name: Activate executable integration stage
        run: python -m pytest tests/core/test_anticipation.py tests/core/test_runtime.py

  executable:
    name: Activate runtime stage
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project
        run: python -m pip install .

      - name: Activate executable runtime
        run: python -m app.core.epistemology_p0.advanced.runtime

  handoff:
    name: Activate next engineering stage
    needs: executable
    runs-on: ubuntu-latest
    steps:
      - name: Record successful handoff
        run: |
          echo "CeutIA runtime stage completed."
          echo "Next stage is activated by the next push to main."
