name: One-time bottleneck hardening

on:
  push:
    paths:
      - '.github/workflows/one-time-bottleneck-hardening.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bottleneck tie contract
        shell: python
        run: |
          from pathlib import Path
          path = Path("backend/app/core/metrics.py")
          text = path.read_text(encoding="utf-8")
          old = '''def territorial_bottleneck_index(\n    demand: Sequence[float] | np.ndarray,\n    capacity: Sequence[float] | np.ndarray,\n) -> int:\n    """Unidad territorial con mayor utilización."""\n    utilization_values = territorial_demand_per_capacity(demand, capacity)\n\n    return int(np.argmax(utilization_values))'''
          new = '''def territorial_bottleneck_index(\n    demand: Sequence[float] | np.ndarray,\n    capacity: Sequence[float] | np.ndarray,\n) -> int | None:\n    """Unidad territorial con mayor utilización cuando el máximo es único.\n\n    Un empate no identifica un cuello de botella único y por tanto devuelve\n    ``None`` en lugar de introducir un ordenamiento arbitrario.\n    """\n    utilization_values = territorial_demand_per_capacity(demand, capacity)\n    maximum = float(np.max(utilization_values))\n    candidates = np.flatnonzero(np.isclose(utilization_values, maximum, rtol=1e-12, atol=1e-12))\n    if candidates.size != 1:\n        return None\n    return int(candidates[0])'''
          if old not in text:
              raise SystemExit("Expected territorial_bottleneck_index source fragment not found")
          text = text.replace(old, new, 1)
          old2 = '''    previous = territorial_bottleneck_index(\n        previous_demand,\n        previous_capacity,\n    )\n    current = territorial_bottleneck_index(\n        current_demand,\n        current_capacity,\n    )\n\n    return None if previous == current else current'''
          new2 = '''    previous = territorial_bottleneck_index(\n        previous_demand,\n        previous_capacity,\n    )\n    current = territorial_bottleneck_index(\n        current_demand,\n        current_capacity,\n    )\n\n    if previous is None or current is None:\n        return None\n    return None if previous == current else current'''
          if old2 not in text:
              raise SystemExit("Expected territorial_bottleneck_migration source fragment not found")
          path.write_text(text.replace(old2, new2, 1), encoding="utf-8")
      - name: Commit correction and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f backend/app/core/metrics.py
          git rm .github/workflows/one-time-bottleneck-hardening.yml
          git commit -m "fix: reject ambiguous territorial bottlenecks"
          git push
