name: One-time calibration boundary hardening

on:
  push:
    paths:
      - '.github/workflows/one-time-calibration-boundary-hardening.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply calibration logit boundary contract
        shell: python
        run: |
          from pathlib import Path
          path = Path("backend/app/core/metrics.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              '''    if not 0.0 < observed < 1.0:\n        raise MetricInputError(\n            "calibration-in-the-large no está definida cuando la prevalencia observada es 0 o 1"\n        )\n    mean_logit = float(np.mean(np.log(np.clip(p, 1e-15, 1 - 1e-15) / np.clip(1 - p, 1e-15, 1 - 1e-15))))''': '''    if not 0.0 < observed < 1.0:\n        raise MetricInputError(\n            "calibration-in-the-large no está definida cuando la prevalencia observada es 0 o 1"\n        )\n    if np.any((p <= 0.0) | (p >= 1.0)):\n        raise MetricInputError(\n            "calibration-in-the-large requiere probabilidades estrictamente entre 0 y 1"\n        )\n    mean_logit = float(np.mean(np.log(p / (1.0 - p))))''',
              '''    prevalence = float(np.mean(truth))\n    if not 0.0 < prevalence < 1.0:\n        raise MetricInputError("calibration slope no está definida cuando la prevalencia observada es 0 o 1")\n    x = np.log(np.clip(p, 1e-15, 1 - 1e-15) / np.clip(1 - p, 1e-15, 1 - 1e-15))''': '''    prevalence = float(np.mean(truth))\n    if not 0.0 < prevalence < 1.0:\n        raise MetricInputError("calibration slope no está definida cuando la prevalencia observada es 0 o 1")\n    if np.any((p <= 0.0) | (p >= 1.0)):\n        raise MetricInputError("calibration slope requiere probabilidades estrictamente entre 0 y 1")\n    x = np.log(p / (1.0 - p))''',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected calibration source fragment not found: {old[:120]!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
      - name: Commit correction and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f backend/app/core/metrics.py
          git rm .github/workflows/one-time-calibration-boundary-hardening.yml
          git commit -m "fix: reject endpoint probabilities in calibration logits"
          git push
