name: One-time dependency hardening

on:
  push:
    paths:
      - '.github/workflows/one-time-dependency-hardening.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply dependency matrix contract
        shell: python
        run: |
          from pathlib import Path
          path = Path("backend/app/core/metrics.py")
          text = path.read_text(encoding="utf-8")
          old = '''def territorial_dependency_matrix(\n    variables: Sequence[Sequence[float]] | np.ndarray,\n) -> np.ndarray:\n    """\n    Matriz de dependencia empírica entre variables territoriales.\n    """\n    matrix = territorial_multi_pressure_matrix(variables)\n\n    if matrix.shape[1] < 2:\n        return np.ones((1, 1), dtype=float)\n\n    return np.corrcoef(matrix, rowvar=False)'''
          new = '''def territorial_dependency_matrix(\n    variables: Sequence[Sequence[float]] | np.ndarray,\n) -> np.ndarray:\n    """\n    Matriz de dependencia empírica entre variables territoriales.\n\n    La correlación muestral requiere al menos dos observaciones y no está\n    definida para una dimensión territorial constante.\n    """\n    matrix = territorial_multi_pressure_matrix(variables)\n\n    if matrix.shape[0] < 2:\n        raise MetricInputError("Se requieren al menos dos observaciones territoriales")\n    if matrix.shape[1] < 2:\n        return np.ones((1, 1), dtype=float)\n    if np.any(np.std(matrix, axis=0, ddof=1) == 0.0):\n        raise MetricInputError("La matriz de dependencia no está definida para una variable constante")\n\n    result = np.corrcoef(matrix, rowvar=False)\n    if not np.all(np.isfinite(result)):\n        raise MetricInputError("La matriz de dependencia contiene valores no finitos")\n    return result'''
          if old not in text:
              raise SystemExit("Expected territorial_dependency_matrix source fragment not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Commit correction and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f backend/app/core/metrics.py
          git rm .github/workflows/one-time-dependency-hardening.yml
          git commit -m "fix: reject undefined territorial correlation inputs"
          git push
