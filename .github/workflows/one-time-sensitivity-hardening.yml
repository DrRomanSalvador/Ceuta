name: One-time sensitivity hardening

on:
  push:
    paths:
      - '.github/workflows/one-time-sensitivity-hardening.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply sensitivity matrix contract
        shell: python
        run: |
          from pathlib import Path
          path = Path("backend/app/core/metrics.py")
          text = path.read_text(encoding="utf-8")
          old = '''    if p.shape[0] != r.shape[0]:\n        raise MetricInputError(\n            "perturbations y responses deben compartir unidades territoriales"\n        )\n\n    if p.shape[0] < 2:\n        raise MetricInputError("Se requieren al menos dos unidades territoriales")\n\n    p_scale = np.std(p, axis=0, ddof=1)'''
          new = '''    if p.shape[0] != r.shape[0]:\n        raise MetricInputError(\n            "perturbations y responses deben compartir unidades territoriales"\n        )\n\n    if p.shape[0] < 2:\n        raise MetricInputError("Se requieren al menos dos unidades territoriales")\n    if p.shape[1] < 1 or r.shape[1] < 1:\n        raise MetricInputError("Debe existir al menos una perturbación y una respuesta")\n    if not np.all(np.isfinite(p)) or not np.all(np.isfinite(r)):\n        raise MetricInputError("perturbations y responses contienen valores no finitos")\n\n    p_scale = np.std(p, axis=0, ddof=1)'''
          if old not in text:
              raise SystemExit("Expected sensitivity source fragment not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Commit correction and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f backend/app/core/metrics.py
          git rm .github/workflows/one-time-sensitivity-hardening.yml
          git commit -m "fix: reject invalid territorial sensitivity matrices"
          git push
