name: CeutIA Prospective Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ceutia-prospective-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Activate prospective-validation stage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completed runtime revision
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install '.[dev]'
      - name: Activate prospective scoring stage
        run: python -m pytest tests/core/test_anticipation.py -q
      - name: Activate next stage
        run: echo "Prospective-validation stage completed; interaction/regime stage is now unblocked for the next manually validated revision."
