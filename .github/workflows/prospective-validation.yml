name: CeutIA Prospective Validation

on:
  workflow_run:
    workflows: [CeutIA Continuous Advance]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ceutia-prospective-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  validate:
    name: Activate prospective-validation stage
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completed runtime revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install '.[dev]'

      - name: Activate prospective scoring stage
        run: python -m pytest tests/core/test_anticipation.py -q

      - name: Activate next stage
        run: echo "Prospective-validation stage completed; interaction/regime stage is now unblocked for the next validated revision."
