name: Repair current syntax blockers

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize concatenated Python modules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def extract(path: str, marker: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f'{path}: marker not found: {marker}')
              end = text.find('"""', start)
              if end < 0:
                  raise SystemExit(f'{path}: docstring end not found')
              future = text.find('from __future__ import annotations', end)
              if future < 0:
                  raise SystemExit(f'{path}: future import not found')
              p.write_text('"""' + text[start:end + 3] + '\n\n' + text[future:], encoding='utf-8')

          extract('backend/app/core/adversarial_validation.py', 'CeutIA — Adversarial Validation Gate')
          extract('backend/app/core/epistemic_validation.py', 'CEUTIA PUBLIC — Epistemic Validation Engine.')
          extract('backend/app/core/information_boundary.py', 'CeutIA information-flow confidentiality boundary.')
          extract('backend/app/core/models.py', 'CeutIA — Dynamic Systems Model Layer.')
          extract('backend/app/security/__init__.py', 'CEUTIA PUBLIC — Security Boundary.')
          extract('backend/app/core/metrics.py', 'Catálogo matemático y motor de métricas de CeutIA.')

          p = Path('backend/app/core/system_integrator.py')
          text = p.read_text(encoding='utf-8')
          cut = text.find('\n    """\nCeutIA — System Integrator (skeleton, non-operational)')
          if cut >= 0:
              p.write_text(text[:cut].rstrip() + '\n', encoding='utf-8')
          PY

          python -m compileall -q backend api ceuta-final

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/core backend/app/security/__init__.py
          if ! git diff --cached --quiet; then
            git commit -m 'repair: normalize concatenated core modules'
            git push
          fi
