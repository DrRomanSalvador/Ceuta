name: CeutIA Security Control Plane

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  protected-control-plane:
    name: Protected control-plane integrity gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect protected-control changes
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          protected=(
            "AUTHORITY_HIERARCHY.md"
            "SUPREME_SECURITY_LAW.md"
            "AGENTS.md"
            "00_GOVERNANCE/"
            "01_HUMAN_SAFETY_AND_RIGHTS/"
            "02_SECURITY_CONTROL_PLANE/"
            "03_INCIDENTS_AND_RECOVERY/"
            ".github/CODEOWNERS"
            ".github/workflows/security-control-plane.yml"
          )
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
            for path in "${changed[@]}"; do
              for protected_path in "${protected[@]}"; do
                if [[ "$path" == "$protected_path" || "$protected_path" == */ && "$path" == "$protected_path"* ]]; then
                  if [[ "$PR_TITLE" != \[SECURITY-CONTROL-CHANGE\]* ]]; then
                    echo "BLOCKED: protected control-plane file changed without [SECURITY-CONTROL-CHANGE]: $path"
                    exit 1
                  fi
                fi
              done
            done
          else
            mapfile -t changed < <(git diff --name-only "${GITHUB_SHA}^" "$GITHUB_SHA")
            for path in "${changed[@]}"; do
              for protected_path in "${protected[@]}"; do
                if [[ "$path" == "$protected_path" || "$protected_path" == */ && "$path" == "$protected_path"* ]]; then
                  echo "AUDIT: protected control-plane file changed on main: $path"
                fi
              done
            done
          fi
          echo "Protected control-plane integrity gate completed."

  runtime-security:
    name: Executable security enforcement gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install project and security test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Verify security application import target
        working-directory: Ceuta
        env:
          PYTHONPATH: ${{ github.workspace }}/Ceuta/backend:${{ github.workspace }}/Ceuta
        run: |
          python -c 'import app.security.enforcement as m; print(m.__file__)'

      - name: Run runtime security regression suite
        working-directory: Ceuta
        env:
          PYTHONPATH: ${{ github.workspace }}/Ceuta/backend:${{ github.workspace }}/Ceuta
        run: python -m pytest -c /dev/null --import-mode=importlib tests/test_security_enforcement.py tests/test_tool_boundary.py tests/test_external_trust.py -q

      - name: Run security static checks
        working-directory: Ceuta
        env:
          PYTHONPATH: ${{ github.workspace }}/Ceuta/backend:${{ github.workspace }}/Ceuta
        run: |
          python -m ruff check backend/app/security tests/test_security_enforcement.py tests/test_tool_boundary.py tests/test_external_trust.py
          python -m bandit -q -r backend/app/security
