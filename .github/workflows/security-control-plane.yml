name: CeutIA Security Control Plane

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  protected-control-plane:
    name: Protected control-plane integrity gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect protected-control changes
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          protected=(
            "SUPREME_SECURITY_LAW.md"
            "OWNER_AUTHORITY_ROOT.md"
            "OWNER_SECURITY_AND_LIABILITY_CONTROL_PLANE.md"
            "HUMAN_RIGHTS_MEDICAL_LEGAL_NATIONAL_SECURITY_AND_DUAL_USE_CONTROL.md"
            "AI_AUTONOMY_BOUNDARY.md"
            "OWNER_COMPROMISE_RECOVERY_PROTOCOL.md"
            "SECURITY_EXTREME_CONTROL_MATRIX.md"
            "SECURITY_TECHNICAL_ENFORCEMENT_ARCHITECTURE.md"
            "SECURITY_ENFORCEMENT_TEST_PLAN.md"
            "SECURITY_RUNTIME_ENFORCEMENT.md"
            "AGENTS.md"
            "AI_MANDATORY_SYSTEM_CONSTITUTION.md"
            "SUPRMIND_AI_COUNCIL_CONSTITUTION.md"
            "AI_SECURITY_INCIDENT_LESSONS.md"
            "AI_SECURITY_INCIDENT_LESSONS_EXTENDED.md"
            ".github/CODEOWNERS"
            ".github/workflows/security-control-plane.yml"
          )

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
            for path in "${changed[@]}"; do
              for protected_path in "${protected[@]}"; do
                if [[ "$path" == "$protected_path" ]]; then
                  if [[ "$PR_TITLE" != \[SECURITY-CONTROL-CHANGE\]* ]]; then
                    echo "BLOCKED: protected control-plane file changed without [SECURITY-CONTROL-CHANGE]: $path"
                    exit 1
                  fi
                  echo "REVIEW REQUIRED: protected control-plane change: $path"
                fi
              done
            done
          else
            mapfile -t changed < <(git diff --name-only "${GITHUB_SHA}^" "$GITHUB_SHA")
            for path in "${changed[@]}"; do
              for protected_path in "${protected[@]}"; do
                if [[ "$path" == "$protected_path" ]]; then
                  echo "AUDIT: protected control-plane file changed on main: $path"
                fi
              done
            done
          fi

          echo "Protected control-plane integrity gate completed."

  runtime-security:
    name: Executable security enforcement gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install project and security test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run runtime security regression suite
        run: python -m pytest Ceuta/tests/test_security_enforcement.py Ceuta/tests/test_tool_boundary.py -q

      - name: Run security static checks
        run: |
          python -m ruff check Ceuta/backend/app/security Ceuta/tests/test_security_enforcement.py Ceuta/tests/test_tool_boundary.py
          python -m bandit -q -r Ceuta/backend/app/security
