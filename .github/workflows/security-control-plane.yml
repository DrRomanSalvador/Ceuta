name: CeutIA Security Control Plane

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protected-control-plane:
    name: Protected control-plane integrity gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect protected-control changes
        shell: bash
        run: echo "Security control-plane validation is manually dispatched during the engineering phase."

  runtime-security:
    name: Executable security enforcement gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install project and security test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Verify security package import target
        env:
          PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
        run: python -c 'import app.security as m; print(m.__file__)'
      - name: Run runtime security regression suite
        env:
          PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
        run: python -m pytest -c /dev/null --import-mode=importlib tests/core/test_adversarial_validation.py tests/core/test_safety_core.py -q
      - name: Validate v1 JSON schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          schemas = sorted(Path("contracts/v1").glob("*.schema.json"))
          assert schemas, "No v1 schemas found"
          for path in schemas:
              data = json.loads(path.read_text(encoding="utf-8"))
              assert data.get("$schema") == "https://json-schema.org/draft/2020-12/schema", path
              assert data.get("title"), path
              assert data.get("type") == "object", path
              assert data.get("additionalProperties") is False, path
              assert data.get("$id", "").endswith(path.name), path
          print(f"Validated {len(schemas)} v1 JSON schema documents.")
          PY
      - name: Run P0 observation and temporal contract suites
        env:
          PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
        run: python -m pytest -c /dev/null --import-mode=importlib tests/test_p0_contracts.py tests/test_observation_boundary.py -q
      - name: Run security static checks
        env:
          PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
        run: |
          python -m ruff check backend/app/security backend/app/core/p0_contracts.py backend/app/core/observation_boundary.py tests/core/test_adversarial_validation.py tests/core/test_safety_core.py tests/test_p0_contracts.py tests/test_observation_boundary.py
          python -m bandit -q -r backend/app/security backend/app/core/p0_contracts.py backend/app/core/observation_boundary.py --skip B404,B603
