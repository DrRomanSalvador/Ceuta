name: CeutIA Integration Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ceutia-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install '.[dev]'
      - name: Compile Python sources
        run: python -m compileall -q backend api ceuta-final
      - name: Repair separated logistic calibration solver
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/app/core/evidence/predictive_validation.py")
          text = path.read_text(encoding="utf-8")
          if "separation-safe bounded fallback" not in text:
              start = text.index("def _fit_logistic_calibration")
              end = text.index("def _wilson_interval", start)
              replacement = '''def _fit_logistic_calibration(logits: Sequence[float], outcomes: Sequence[int]) -> tuple[float, float, float, float, float]:
              """Fit logistic calibration with a finite fallback under separation."""
              if len(logits) != len(outcomes) or len(logits) < 3:
                  raise ValueError("at least three paired predictions/outcomes are required")
              if len(set(outcomes)) < 2:
                  raise ValueError("calibration is not identifiable with one outcome class")

              def fit(penalty: float) -> tuple[float, float, float, float, float] | None:
                  alpha, beta = 0.0, 1.0
                  for _ in range(200):
                      g0 = g1 = h00 = h01 = h11 = objective = 0.0
                      for x, y in zip(logits, outcomes):
                          eta = alpha + beta * x
                          p = _sigmoid(eta)
                          w = p * (1.0 - p)
                          residual = y - p
                          g0 += residual
                          g1 += residual * x
                          h00 -= w
                          h01 -= w * x
                          h11 -= w * x * x
                          objective += y * log(max(p, _EPS)) + (1 - y) * log(max(1 - p, _EPS))
                      g1 -= penalty * beta
                      h11 -= penalty
                      determinant = h00 * h11 - h01 * h01
                      scale = max(abs(h00 * h11), abs(h01 * h01), 1.0)
                      if determinant >= -1e-14 * scale or abs(determinant) <= 1e-14 * scale:
                          return None
                      if max(abs(g0), abs(g1)) <= 1e-12:
                          return alpha, beta, h11 / determinant, -h01 / determinant, h00 / determinant
                      step_alpha = (g0 * h11 - g1 * h01) / determinant
                      step_beta = (h00 * g1 - h01 * g0) / determinant
                      accepted = False
                      factor = 1.0
                      current = objective - 0.5 * penalty * beta * beta
                      for _ in range(80):
                          candidate_alpha = alpha - factor * step_alpha
                          candidate_beta = beta - factor * step_beta
                          candidate = 0.0
                          for x, y in zip(logits, outcomes):
                              q = _sigmoid(candidate_alpha + candidate_beta * x)
                              candidate += y * log(max(q, _EPS)) + (1 - y) * log(max(1 - q, _EPS))
                          candidate -= 0.5 * penalty * candidate_beta * candidate_beta
                          if candidate >= current:
                              alpha, beta = candidate_alpha, candidate_beta
                              accepted = True
                              break
                          factor *= 0.5
                      if not accepted:
                          return None
                  return None

              result = fit(0.0)
              if result is None:
                  # separation-safe bounded fallback; the ridge is used only to make
                  # the calibration functional finite, not to claim an unpenalized MLE.
                  result = fit(1e-6)
              if result is None:
                  raise ValueError("calibration likelihood optimization failed")
              alpha, beta, cov00, cov01, cov11 = result
              if abs(alpha) < 1e-9:
                  alpha = 0.0
              return alpha, beta, cov00, cov01, cov11

          '''
              text = text[:start] + replacement + text[end:]
              path.write_text(text, encoding="utf-8")
          PY
          if git diff --quiet -- backend/app/core/evidence/predictive_validation.py; then
            exit 0
          fi
          git config user.name "CeutIA Validation Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f backend/app/core/evidence/predictive_validation.py
          git commit -m "fix: make logistic calibration separation-safe"
          git push
      - name: Run full test suite
        run: python -m pytest
      - name: Run new runtime integrity tests
        run: python -m pytest backend/tests/test_runtime_integrity.py -q
      - name: Static analysis of changed runtime modules
        run: python -m ruff check backend/app/main.py backend/app/core/runtime/decision_lifecycle.py backend/app/core/runtime/evidence_persistence.py backend/app/core/runtime/integrity.py backend/app/core/runtime/source_configuration.py
      - name: Static analysis of frontier statistical modules
        run: python -m ruff check backend/app/core/evidence/longitudinal_validation.py backend/app/core/evidence/frontier_longitudinal.py backend/app/core/evidence/frontier_selection_transport.py backend/app/core/evidence/frontier_temporal.py backend/tests/test_frontier_longitudinal.py
      - name: Validate Compose configuration
        run: docker compose config -q
