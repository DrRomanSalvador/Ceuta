name: CeutIA Integration Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ceutia-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install '.[dev]'
      - name: Compile Python sources
        run: python -m compileall -q backend api ceuta-final
      - name: Inventory current metrics module
        run: python scripts/inventory_metrics_symbols.py --output metrics-symbol-inventory.json
      - name: Upload current metrics inventory
        uses: actions/upload-artifact@v6
        with:
          name: metrics-symbol-inventory-${{ github.sha }}
          path: metrics-symbol-inventory.json
          if-no-files-found: error
      - name: Run full test suite
        run: python -m pytest
      - name: Run runtime integrity tests
        run: python -m pytest backend/tests/test_runtime_integrity.py -q
      - name: Validate Compose configuration
        run: docker compose config -q
