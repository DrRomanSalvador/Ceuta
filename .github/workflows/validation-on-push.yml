name: CeutIA Integration Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ceutia-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: One-off metrics duplicate cleanup
        if: github.event_name == 'push' && github.event.head_commit.message == 'chore: enable one-off metrics cleanup'
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          path = Path('backend/app/core/metrics.py')
          source = path.read_text(encoding='utf-8')
          tree = ast.parse(source)
          docstrings = [n for n in tree.body if isinstance(n, ast.Expr) and isinstance(n.value, ast.Constant) and isinstance(n.value.value, str)]
          second_doc = next((n for n in docstrings if n.lineno > 2000), None)
          scientific_fn = next((n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name == 'get_scientific_metric_invariants'), None)
          if second_doc and scientific_fn and scientific_fn.lineno > second_doc.lineno:
              lines = source.splitlines(keepends=True)
              start, end = second_doc.lineno - 1, scientific_fn.lineno - 1
              rewritten = ''.join(lines[:start] + lines[end:])
              tree2 = ast.parse(rewritten)
              lines2 = rewritten.splitlines(keepends=True)
              all_assignments = []
              for node in tree2.body:
                  if isinstance(node, ast.Assign) and any(isinstance(t, ast.Name) and t.id == '__all__' for t in node.targets):
                      all_assignments.append((node.lineno - 1, node.end_lineno))
                  elif isinstance(node, ast.AnnAssign) and isinstance(node.target, ast.Name) and node.target.id == '__all__':
                      all_assignments.append((node.lineno - 1, node.end_lineno))
              for a, b in sorted(all_assignments[1:], reverse=True):
                  del lines2[a:b]
              path.write_text(''.join(lines2), encoding='utf-8')
          PY
          python - <<'PY'
          import ast
          from collections import Counter
          from pathlib import Path
          tree = ast.parse(Path('backend/app/core/metrics.py').read_text(encoding='utf-8'))
          names = [n.name for n in tree.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef))]
          duplicates = sorted(name for name, count in Counter(names).items() if count > 1)
          assert not duplicates, f'Duplicate top-level definitions remain: {duplicates}'
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/core/metrics.py
          if ! git diff --cached --quiet; then
            git commit -m 'refactor: remove duplicated metrics module block'
            git push origin HEAD:main
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install '.[dev]'
      - name: Compile Python sources
        run: python -m compileall -q backend api ceuta-final
      - name: Inventory current metrics module
        run: python scripts/inventory_metrics_symbols.py --output metrics-symbol-inventory.json
      - name: Upload current metrics inventory
        uses: actions/upload-artifact@v4
        with:
          name: metrics-symbol-inventory-${{ github.sha }}
          path: metrics-symbol-inventory.json
          if-no-files-found: error
      - name: Run full test suite
        run: python -m pytest
      - name: Run runtime integrity tests
        run: python -m pytest backend/tests/test_runtime_integrity.py -q
      - name: Validate Compose configuration
        run: docker compose config -q
