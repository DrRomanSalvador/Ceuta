engineering_handoffs:
  - id: H1
    capability: knowledge_impact_graph
    owner_candidate: INGENIERO
    priority: P0
    acceptance: "Upstream mutation identifies affected downstream claims/results/decisions and proportional revalidation obligations."
  - id: H2
    capability: discovery_funnel
    owner_candidate: existing_epistemology_scientific_runtime
    priority: P0
    acceptance: "Anomaly persists as candidate discovery, routes to rival hypotheses and falsification, and cannot silently become validated knowledge."
  - id: H3
    capability: disagreement_lifecycle
    owner_candidate: governance_evidence
    priority: P0
    acceptance: "Typed unresolved disagreement survives serialization and can produce a discriminative investigation without consensus collapse."
  - id: H4
    capability: capability_regression_benchmark
    owner_candidate: QA_ENGINEERING_ARCHITECTURE
    priority: P1
    acceptance: "Release comparison reports gain/loss/change/fragility across stable capability benchmarks."
  - id: H5
    capability: scientific_epistemic_debt
    owner_candidate: NOTARIO_PLUS_ENGINEERING
    priority: P1
    acceptance: "Material unvalidated claim creates a distinct debt item linked to affected knowledge and validation state."

mission_evolution:
  new_mission_justified: false
  rationale: "Existing owners can extend current epistemology, evidence, provenance, governance, learning, metrics and QA surfaces."
  re_evaluate_only_if: "An existing owner cannot implement a materially necessary capability without a distinct stable responsibility boundary."
