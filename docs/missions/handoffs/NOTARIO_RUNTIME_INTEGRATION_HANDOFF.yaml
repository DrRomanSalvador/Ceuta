acceptance:
  H1:
    executable_requirements:
      - "Register real entities and typed relationships using existing provenance/lineage primitives."
      - "Persist relationships and reconstruct temporal/provenance history."
      - "Traverse upstream mutation to downstream claims/models/predictions/decisions/actions/outcomes."
      - "Emit explicit revalidation obligations with required validation level and blocking status."
      - "Pass positive and negative traversal tests with reproducible evidence."
  H2:
    executable_requirements:
      - "Execute SIGNAL/ANOMALY -> CANDIDATE -> QUESTION -> HYPOTHESIS -> FALSIFICATION -> EVIDENCE -> STATUS."
      - "Preserve rejection, inconclusive results, rival hypotheses and insufficient evidence."
      - "Prevent model-generated hypotheses from becoming evidence by construction."
      - "Permit promotion only through declared evidence/falsification gates."
      - "Persist traceability and regression-test the lifecycle."
  H3:
    executable_requirements:
      - "Execute typed disagreement through competing positions, assumptions, evidence, discriminative test and VoI/test."
      - "Preserve minority position and full history when resolved or maintained."
      - "Represent error, uncertainty, evidence conflict, model disagreement, ontology disagreement, assumption disagreement and data conflict distinctly."
      - "Provide negative tests against consensus collapse and history loss."
  H4:
    executable_requirements:
      - "Execute CAPABILITY -> BASELINE -> CURRENT -> DIFFERENCE -> REGRESSION -> IMPACT -> REVALIDATION."
      - "Detect at least one real seeded degradation, not merely serialize regression=true."
      - "Distinguish software-test pass from scientific capability preservation."
      - "Cover technical, statistical, epistemic, calibration, coverage, provenance and temporal-integrity regression dimensions where applicable."
      - "Persist reproducible benchmark evidence."
  H5:
    executable_requirements:
      - "Create debt from material scientific/epistemic weakness and link it to affected claims/capabilities/evidence/validation."
      - "Track impact, ageing, priority, repayment, validation and closure."
      - "Answer which weakened knowledge supports which capability and downstream consequence if debt persists."
      - "Prevent closure while mandatory validation remains outstanding."
      - "Pass negative tests against debt invisibility/orphaning."

non_goals:
  - "Do not create a second provenance system."
  - "Do not create a second hypothesis engine."
  - "Do not create a second disagreement engine."
  - "Do not create a second VoI engine."
  - "Do not create a second claims system."
  - "Do not create a second benchmark framework if an existing framework can be extended."
  - "Do not treat schemas, YAML, PR descriptions or documentation as runtime evidence."
  - "Do not promote generated model output to scientific evidence."
  - "Do not collapse disagreement into consensus automatically."

required_return_evidence:
