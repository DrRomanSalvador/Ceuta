  - "executed_test_commands_and_results"
  - "runtime_execution_trace_for_H1_H5"
  - "persistence_evidence"
  - "positive_and_negative_test_evidence"
  - "known_limitations_and_unresolved_failures"
  - "downstream_impact_report"
  - "revalidation_obligations_created"

